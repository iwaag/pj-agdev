[project]
name = "comfynotify"
version = "0.1.0"
description = "Disk-backed ComfyUI completion notifier for Zulip"
requires-python = ">=3.11"
dependencies = ["pyagag"]

[project.scripts]
comfynotify = "comfynotify.cli:main"

[tool.uv.sources]
pyagag = { git = "https://github.com/iwaag/pyagag.git", branch = "main" }

[dependency-groups]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/comfynotify"]

[tool.pytest.ini_options]
testpaths = ["tests"]
