# agobserver's agent configuration (ag.agent-config.v2).
#
# Observer waits by evaluating often, not by holding one long session open,
# so its default backend is the **local** model: an evaluation that costs
# nothing can run every minute for a day. `sonnet` exists for the intake of
# a request the local model cannot read, and is a public execution option;
# no polling evaluation is meant to run on it.
#
# Per-machine backend choice belongs in the ignored `.local/agents.local.toml`
# overlay, and the ollama base URL always does.
schema = "ag.agent-config.v2"
project = "agobserver"

[models."ollama/qwen3.8:27b-mxfp8"]
max_tokens = 8192

[models."anthropic/claude-sonnet-5"]

[profiles.local]
harness = "agcode"
model = "ollama/qwen3.8:27b-mxfp8"

[profiles.sonnet]
harness = "claude_code"
model = "anthropic/claude-sonnet-5"

[profiles.stub]
harness = "fake"
model = "ollama/qwen3.8:27b-mxfp8"

# Reading one watch request and turning it into an accepted watch — or into
# one concrete question. Runs once per request, not per poll.
[roles.front]
profile = "local"
requires = []
allowed_tools = "Read,Write,Edit,Glob,Grep,Bash"

# One short evaluation of one active watch. This is the role the worker runs
# on a timer, and the reason the default profile is local. Its grant is wide
# on purpose: an observer that cannot run the command that shows the state of
# its target cannot observe (Tool Giving — see devpolicy/terms.md).
[roles.observe]
profile = "local"
requires = []
allowed_tools = "Read,Write,Edit,Glob,Grep,Bash"

# A contribution to an argue (`argue` p1): named in `#argue`, Observer
# answers in place about what can be waited on and watched. One run per
# invitation, on the paid model — an argue is a conversation, not a poll —
# with the reading tools only; a watch is still opened in its own channel.
[roles.argue]
profile = "sonnet"
requires = []
allowed_tools = "Read,Glob,Grep,Bash(agrefs:*)"

# One judgment about one stall candidate (`robust_workflow` p1 step 4): is a
# ✔ on live work a mistake, is a long silence a dead worker? Run by the
# request monitor only for what the records cannot decide, on the local model
# for the same reason the watch evaluations are. It reads what its prompt
# carries and writes one result file.
[roles.triage]
profile = "local"
requires = []
allowed_tools = "Read,Write"
